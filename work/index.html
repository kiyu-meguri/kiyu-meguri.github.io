<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仕事とお金の巡り診断｜輝由</title>
<meta name="description" content="8つの質問に答えると、今のあなたの仕事とお金の悩みのタイプが分かる診断。星数読み（九星気学 × 数秘術）の輝由がお届けします。">
<meta property="og:title" content="仕事とお金の巡り診断｜輝由">
<meta property="og:description" content="8つの質問に答えると、今のあなたの仕事とお金の悩みのタイプが分かるよ。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b231c;
    --bg-card: #13342a;
    --line: #2f5a4b;
    --text: #eef5f1;
    --text-sub: #b3cfc3;
    --gold: #d8b45a;
    --gold-strong: #f0cf7a;
    --choice-hover: #1c4537;
    --line-green: #06c755;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1d4a3c 0%, var(--bg) 60%);
    background-color: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", sans-serif;
    line-height: 1.8;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 16px 48px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 20px;
  }
  .brand {
    text-align: center;
    color: var(--gold);
    font-family: "Noto Serif JP", serif;
    letter-spacing: 0.2em;
    font-size: 14px;
    margin: 0 0 8px;
  }
  h1, h2 {
    font-family: "Noto Serif JP", serif;
    text-align: center;
    margin: 0 0 16px;
    line-height: 1.5;
  }
  h1 { font-size: 26px; }
  h1 span { color: var(--gold-strong); }
  h2 { font-size: 20px; }
  p { margin: 0 0 16px; }
  .sub { color: var(--text-sub); font-size: 14px; text-align: center; }
  .btn {
    display: block;
    width: 100%;
    border: none;
    border-radius: 999px;
    padding: 16px;
    font-size: 17px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  .btn-gold { background: var(--gold); color: #0b231c; }
  .btn-gold:hover { background: var(--gold-strong); }
  .btn-line { background: var(--line-green); color: #fff; }
  .btn-text {
    background: none;
    color: var(--text-sub);
    font-size: 14px;
    margin-top: 12px;
    text-decoration: underline;
  }
  .progress {
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 100%;
    width: 0;
    background: var(--gold);
    transition: width 0.3s;
  }
  .count { color: var(--text-sub); font-size: 13px; text-align: right; margin-bottom: 16px; }
  .choices { display: grid; gap: 12px; }
  .choice {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 16px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    line-height: 1.6;
  }
  .choice:hover, .choice:focus-visible { background: var(--choice-hover); border-color: var(--gold); outline: none; }
  .result-name {
    font-family: "Noto Serif JP", serif;
    color: var(--gold-strong);
    font-size: 26px;
    text-align: center;
    margin: 4px 0 20px;
  }
  .keyword-box {
    border: 1px dashed var(--gold);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    margin: 24px 0 16px;
  }
  .keyword { font-size: 24px; font-weight: 500; color: var(--gold-strong); }
  .notice { color: var(--text-sub); font-size: 13px; text-align: center; min-height: 1.5em; margin: 8px 0 0; }
  footer { color: var(--text-sub); font-size: 12px; text-align: center; margin-top: 24px; }
  [hidden] { display: none !important; }
  /* 日本語を言葉のまとまりで改行する（<wbr> の所だけで切れる） */
  .card { word-break: keep-all; overflow-wrap: anywhere; line-break: strict; }
</style>
</head>
<body>
<main>

  <!-- はじめの画面 -->
  <section id="start" class="card">
    <p class="brand">輝由｜星数読み</p>
    <h1><span>仕事とお金の巡り</span><br>診断</h1>
    <p class="sub">8つの質問に答えると、<br>今のあなたの仕事とお金の悩みのタイプが分かるよ。<br>30秒で終わるよ。</p>
    <button id="start-btn" class="btn btn-gold" type="button">診断をはじめる</button>
  </section>

  <!-- 質問の画面 -->
  <section id="quiz" class="card" hidden>
    <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
    <p id="count" class="count"></p>
    <h2 id="question"></h2>
    <div id="choices" class="choices"></div>
  </section>

  <!-- 結果の画面 -->
  <section id="result" class="card" hidden>
    <p class="sub">あなたは</p>
    <p id="result-name" class="result-name"></p>
    <p id="result-text"></p>
    <div class="keyword-box">
      <p class="sub">LINEでこの言葉を送ってくれたら、<br>このタイプの詳しい読み方が届くよ</p>
      <p id="keyword" class="keyword"></p>
    </div>
    <a id="line-btn" class="btn btn-line" href="#" target="_blank" rel="noopener">LINEで詳しい読み方を受け取る</a>
    <p id="notice" class="notice"></p>
    <button id="retry-btn" class="btn btn-text" type="button">もう一度診断する</button>
  </section>

  <footer>占いによる読み解きです。未来の結果を約束するものではありません。<br><a href="../tokushoho.html" style="color:inherit">特定商取引法にもとづく表示</a>　© 輝由</footer>
</main>

<script>
  // ここに公式LINEの友だち追加URLを入れる（例：https://lin.ee/xxxxxxx）
  const LINE_URL = "https://line.me/R/ti/p/@974fkchl";  // 仕事とお金の公式LINE

  // 質問と選択肢（type はタイプ A〜D。文は 金運/診断ページ/診断の文.md）
  // A=貯まらない／B=報われない／C=続けるか迷う／D=決めきれない
  const QUESTIONS = [
    { text: "仕事とお金のことで、夜ふと考えてしまうのは？", choices: [
      { label: "今月も、お金が残らなかったな", type: "A" },
      { label: "こんなにやってるのに、なんで評価されないんだろう", type: "B" },
      { label: "この仕事、あと何年続けるんだろう", type: "C" },
      { label: "あの話、どっちを選べばいいんだろう", type: "D" } ] },
    { text: "友達に仕事の話をする時、よく言うのは？", choices: [
      { label: "「なぜかお金が貯まらないんだよね」", type: "A" },
      { label: "「がんばっても、給料変わらないし」", type: "B" },
      { label: "「辞めたいけど、次がないんだよね」", type: "C" },
      { label: "「迷ってて、まだ決められない」", type: "D" } ] },
    { text: "給料日の夜、近いのは？", choices: [
      { label: "引き落としのあと、残りを見てため息", type: "A" },
      { label: "明細を見て、がんばりと合っていない気がする", type: "B" },
      { label: "「この金額のために続けてるのかな」と思う", type: "C" },
      { label: "今の会社と別の道の条件を、つい比べてしまう", type: "D" } ] },
    { text: "日曜の夜、スマホでつい見てしまうのは？", choices: [
      { label: "節約や貯金のコツ", type: "A" },
      { label: "評価される人の働き方", type: "B" },
      { label: "求人アプリ（開いて、すぐ閉じる）", type: "C" },
      { label: "転職や異動をした人の体験談", type: "D" } ] },
    { text: "今いちばん欲しいものは？", choices: [
      { label: "お金の不安がない毎日", type: "A" },
      { label: "がんばりが、ちゃんと認められる実感", type: "B" },
      { label: "「このままでいい」と思える働き方", type: "C" },
      { label: "「こっちでよかった」と思える決め手", type: "D" } ] },
    { text: "これまでをふり返ると？", choices: [
      { label: "節約を始めても、続かないことが多い", type: "A" },
      { label: "がんばった年ほど、報われなかった気がする", type: "B" },
      { label: "「辞めたい」と「でも」を、何度もくり返してきた", type: "C" },
      { label: "大事な選択ほど、ぎりぎりまで決められなかった", type: "D" } ] },
    { text: "占いで、まず知りたいのは？", choices: [
      { label: "お金を整えやすい時期", type: "A" },
      { label: "がんばりが届きやすい時期", type: "B" },
      { label: "動くか、今は待つか", type: "C" },
      { label: "決めるのに向いた時期と、自分に合った決め方", type: "D" } ] },
    { text: "「動く月」が来たら、最初にしたいことは？", choices: [
      { label: "出ていくお金を見直して、使い道を決める", type: "A" },
      { label: "自分がしてきたことを、上司に伝えてみる", type: "B" },
      { label: "気になる会社や人に、話を聞きに行く", type: "C" },
      { label: "迷っていた話に、返事をする", type: "D" } ] },
  ];

  // 結果4タイプ（keyword は 金運/無料鑑定/LINEの文.md の応答メッセージのキーワードと同じにする）
  const RESULTS = {
    A: { name: "お金の巡りタイプ", keyword: "貯まらない",
         text: "お金が残らない時は、だらしないからじゃなくて、整える時期と動く時期を知らないまま、毎月同じやり方を続けているのかも。巡りを知ると、見直す月と使う月を選びやすくなるよ。" },
    B: { name: "がんばりの巡りタイプ", keyword: "報われない",
         text: "がんばりが報われないのは、力が足りないからじゃない。がんばりどころの時期と整える時期を知ると、伝える時と待つ時を選びやすくなるよ。" },
    C: { name: "働き方の巡りタイプ", keyword: "続けるか迷う",
         text: "辞めたいのか、疲れているだけなのか分からない時は、今が「決める時期」じゃないだけのことも。動く月と整える月を知ると、動くか待つかを選びやすくなるよ。" },
    D: { name: "選択の巡りタイプ", keyword: "決めきれない",
         text: "決めきれないのは、優柔不断だからじゃなくて、ちゃんと考えているから。今が決める時期か、材料を集める時期かを知ると、選びやすくなるよ。" },
  };

  // 言葉の切れ目に <wbr> を入れた HTML を返す（漢字・カタカナ・かっこの前と、句読点の後ろだけで切る）
  const SEGMENTER = (typeof Intl !== "undefined" && Intl.Segmenter) ? new Intl.Segmenter("ja", { granularity: "word" }) : null;
  const BREAK_BEFORE = /^[\u4E00-\u9FFF\u30A0-\u30FF「（0-9A-Za-z]/;
  const BREAK_AFTER = /[、。」）]$/;
  const escapeHtml = (t) => t.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function jaWrap(text) {
    if (!SEGMENTER) return escapeHtml(text);
    const out = [];
    let chunk = "", inQuote = 0;
    for (const { segment } of SEGMENTER.segment(text)) {
      if (chunk && inQuote === 0 && (BREAK_BEFORE.test(segment) || BREAK_AFTER.test(chunk))) {
        out.push(escapeHtml(chunk));
        chunk = "";
      }
      chunk += segment;
      inQuote = Math.max(0, inQuote + (segment.match(/「/g) || []).length - (segment.match(/」/g) || []).length);
    }
    if (chunk) out.push(escapeHtml(chunk));
    return out.join("<wbr>");
  }

  const NEXT_DELAY_MS = 150; // 選んでから次の質問に進むまでの間

  const el = (id) => document.getElementById(id);
  let current = 0;
  let answers = [];

  // 選択肢の並びを入れ替える（答えが偏らないように）
  function shuffle(list) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function show(sectionId) {
    ["start", "quiz", "result"].forEach((id) => { el(id).hidden = id !== sectionId; });
    window.scrollTo(0, 0);
  }

  function renderQuestion() {
    const q = QUESTIONS[current];
    el("progress-bar").style.width = (current / QUESTIONS.length * 100) + "%";
    el("count").textContent = (current + 1) + " / " + QUESTIONS.length;
    el("question").innerHTML = jaWrap(q.text);
    const box = el("choices");
    box.innerHTML = "";
    shuffle(q.choices).forEach((c) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      btn.innerHTML = jaWrap(c.label);
      btn.addEventListener("click", () => choose(c.type));
      box.appendChild(btn);
    });
  }

  function choose(type) {
    answers.push(type);
    current++;
    if (current < QUESTIONS.length) {
      setTimeout(renderQuestion, NEXT_DELAY_MS);
    } else {
      showResult();
    }
  }

  // いちばん多いタイプ。同じ数なら最後の質問（Q8）の答えを優先する
  function decideType() {
    const counts = { A: 0, B: 0, C: 0, D: 0 };
    answers.forEach((t) => { counts[t]++; });
    const max = Math.max(...Object.values(counts));
    const tops = Object.keys(counts).filter((t) => counts[t] === max);
    const lastAnswer = answers[answers.length - 1];
    return tops.includes(lastAnswer) ? lastAnswer : tops[0];
  }

  function showResult() {
    const r = RESULTS[decideType()];
    el("result-name").textContent = r.name;
    el("result-text").innerHTML = jaWrap(r.text);
    el("keyword").textContent = "「" + r.keyword + "」";
    el("line-btn").dataset.keyword = r.keyword;
    el("line-btn").href = LINE_URL || "#";
    el("notice").textContent = "";
    show("result");
  }

  // LINEへ進む前に、キーワードを自動でコピーしておく
  el("line-btn").addEventListener("click", async (e) => {
    const keyword = e.currentTarget.dataset.keyword;
    if (!LINE_URL) {
      e.preventDefault();
      el("notice").textContent = "LINEのURLがまだ設定されていません。";
      return;
    }
    try {
      await navigator.clipboard.writeText(keyword);
      el("notice").textContent = "「" + keyword + "」をコピーしました。LINEに貼って送ってね。";
    } catch (err) {
      el("notice").textContent = "LINEで「" + keyword + "」と送ってね。";
    }
  });

  el("start-btn").addEventListener("click", () => {
    current = 0;
    answers = [];
    renderQuestion();
    show("quiz");
  });

  el("retry-btn").addEventListener("click", () => show("start"));
</script>
</body>
</html>
